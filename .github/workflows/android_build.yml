name: Al-Azzi Grocery Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: al-azzi-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q -o gradle-8.9-bin.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew

      - name: Verify Java and Gradle
        run: |
          java -version
          ./gradlew --version

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists and is non-empty
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          stat -c 'APK size: %s bytes' app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Al-Azzi-Grocery-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 90
